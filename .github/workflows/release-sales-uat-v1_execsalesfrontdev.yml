name: Build and deploy Node.js app to Azure Web App - execsalesfrontdev

on:
  push:
    branches:
      - release/sales-uat-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ---------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # NODE
      # ---------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      # ---------------------------------------------------
      # INSTALL
      # ---------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------
      # BUILD VITE APPLICATION
      # ---------------------------------------------------
      - name: Build application
        run: npm run build

      # ---------------------------------------------------
      # VERIFY DIST
      # ---------------------------------------------------
      - name: Verify build output
        run: |
          echo "Checking dist folder..."
          ls -la dist
          echo "Checking assets..."
          ls -la dist/assets

      # ---------------------------------------------------
      # UPLOAD ONLY DIST
      # ---------------------------------------------------
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # ---------------------------------------------------
      # DOWNLOAD DIST
      # ---------------------------------------------------
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # ---------------------------------------------------
      # VERIFY DOWNLOADED ARTIFACT
      # ---------------------------------------------------
      - name: Verify deployment package
        run: |
          echo "Deployment package:"
          ls -la dist
          ls -la dist/assets

      # ---------------------------------------------------
      # DEPLOY TO UAT
      # ---------------------------------------------------
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "execsalesfrontdev"
          slot-name: "Production"
          package: ./dist
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5EED8CE9C7B14E8DADEFFACAE08A6A81 }}
