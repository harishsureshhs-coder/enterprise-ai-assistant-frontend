# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - rbin-ai-platform-dev-web

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:

  # ======================================================
  # BUILD
  # ======================================================

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------
      # Checkout develop branch
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Node.js
      # --------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'


      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------
      # Build Vite production application
      #
      # This MUST create:
      #
      # dist/
      #   index.html
      #   assets/
      # --------------------------------------------------

      - name: Build frontend
        run: npm run build


      # --------------------------------------------------
      # Verify build output
      # --------------------------------------------------

      - name: Verify Vite build
        run: |
          echo "Contents of dist:"
          ls -la dist
          echo "Contents of dist/assets:"
          ls -la dist/assets


      # --------------------------------------------------
      # Upload ONLY production build
      #
      # IMPORTANT:
      # Do not upload entire React source repository.
      # --------------------------------------------------

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error


  # ======================================================
  # DEPLOY
  # ======================================================

  deploy:

    runs-on: ubuntu-latest
    needs: build

    steps:

      # --------------------------------------------------
      # Download built frontend
      # --------------------------------------------------

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist


      # --------------------------------------------------
      # Deploy ONLY dist to DEV frontend App Service
      # --------------------------------------------------

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rbin-ai-platform-dev-web'
          slot-name: 'Production'
          package: ./dist
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3BF81FC16B7E4BF09153FB6F900D8BB5 }}
